<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电路仿真系统</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <div id="app">

    <!-- ===== 工具栏 ===== -->
    <div id="toolbar">
      <!-- <span class="title">⚡ 电路仿真</span> -->

      <!-- <div class="sep"></div> -->

      <!-- 预留：打开/保存 (Phase 9) -->
      <button id="btnOpen" style="opacity:0.4;" disabled>📂 打开</button>
      <button id="btnSave" style="opacity:0.4;" disabled>💾 保存</button>

      <div class="sep"></div>

      <!-- 模式切换组 -->
      <div class="mode-group">
        <button id="modeSelect" class="active" data-mode="select">选择</button>
        <button id="modeWire" data-mode="wire">连线</button>
        <!-- <button id="modePlace" data-mode="place">放置</button> -->
      </div>

      <div class="sep"></div>

      <!-- 仿真控制 -->
      <div class="sim-group">
        <button id="btnStart" class="primary">▶ 开始</button>
        <button id="btnPause">⏸ 暂停</button>
        <button id="btnStop">⏹ 停止</button>
      </div>

      <div class="sep"></div>

      <button id="btnClear" class="danger">🗑 清空</button>
    </div>

    <!-- ===== 主内容区 ===== -->
    <div id="main">

      <!-- Canvas 画布 -->
      <div id="canvas-container">
        <canvas id="circuitCanvas"></canvas>
      </div>

      <!-- ===== 右侧面板 ===== -->
      <div id="panel">
        <!-- 面板标题 -->
        <div id="panel-header">
          <span class="icon" id="panelIcon">📦</span>
          <span class="label" id="panelTitle">元件库</span>
        </div>
        <!-- 面板内容 -->
        <div id="panel-body">
          <!-- 由 JavaScript 动态填充 -->
          <div id="panelContent"></div>
        </div>
      </div>

    </div>

    <!-- ===== 状态栏 ===== -->
    <div id="statusbar">
      <span  class="item">模式: <span class="value" id="modeDisplay">选择</span></span>
      <span class="item">
        <span class="status-dot idle" id="statusDot"></span>
        仿真: <span class="value" id="simStatus">停止</span>
      </span>
      <span class="item" id="statusMsg"></span>
      
      <div class="spacer"></div>
      <span class="item">元件: <span class="value" id="compCount">0</span></span>
      <span class="item">连线: <span class="value" id="wireCount">0</span></span>
      <span class="value" id="cursorPos">(0, 0)</span>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
